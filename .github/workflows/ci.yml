name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck -w @coss-app/docs
      - run: npm run build
      # skill 的 manifest／components.md／tokens.md 須與原始碼同步（不同步時執行 npm run manifest）
      - run: npm run manifest -- --check
