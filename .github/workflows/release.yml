# 發佈 @coss-app/ui
# 版本由開發者在本機跑 `npx changeset version` 後以 PR 合併（不讓 Actions 開 PR）。
# main 上的版本號若尚未發佈 → 發佈到 npmjs（公開套件）、打 tag、建 GitHub Release。
# 需要 repo secret NPM_TOKEN（npmjs 的 granular token，限 @coss-app scope、可寫入）。
# 正式文件站由 docs.yml 在合併到 main 時部署。
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@coss-app"
      - run: npm ci

      - name: 檢查版本是否已發佈
        id: check
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@coss-app/ui@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@coss-app/ui@$VERSION 已發佈過，略過"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::將發佈 @coss-app/ui@$VERSION"
          fi

      - name: 發佈到 npmjs
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release
          git push --tags

      - name: 建立 GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # 取 CHANGELOG 中這一版的段落（從 "## x.y.z" 到下一個 "## "）
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' packages/ui/CHANGELOG.md > /tmp/notes.md
          gh release create "@coss-app/ui@$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md
